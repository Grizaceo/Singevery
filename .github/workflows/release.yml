name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Electron 43 declara engines node >= 22.12.0: con Node 20, npm ci falla.
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      # Puerta de calidad: un instalador que va a manos de terceros no debería
      # publicarse con los tests en rojo.
      - name: Lint
        working-directory: apps/desktop
        run: npm run lint

      - name: Test
        working-directory: apps/desktop
        run: npm test

      # package:full compila el sidecar AUTOCONTENIDO (--self-contained true) y
      # luego empaqueta. Antes este workflow hacía su propio `dotnet publish`
      # con --self-contained false: el instalador resultante exigía .NET 8 en la
      # máquina del usuario y, sin él, SMTC moría en silencio (adiós pausa/seek
      # instantáneos). Un solo comando = una sola fuente de verdad.
      - name: Package Windows installer (sidecar autocontenido)
        working-directory: apps/desktop
        run: npm run package:full

      # Si el sidecar no quedó dentro del paquete, el instalador "funciona"
      # pero pierde la mejor fuente de sincronía. Mejor fallar aquí.
      - name: Verify SMTC sidecar was bundled
        shell: pwsh
        run: |
          # OJO con la ruta: build:smtc publica en apps/desktop/build/smtc-dist.
          # Este check apuntaba a native/smtc/dist —la salida del build.ps1 local,
          # que está gitignoreada y por tanto NO existe en un checkout limpio—, así
          # que el job moría aquí después de empaquetar y ningún tag llegaba a
          # publicar release.
          $sidecar = 'apps/desktop/build/smtc-dist/espejo-smtc.exe'
          if (-not (Test-Path $sidecar)) {
            throw "espejo-smtc.exe no se generó: el instalador quedaría sin SMTC."
          }
          Write-Host "Sidecar OK:" (Get-Item $sidecar).Length "bytes"

      # Sin firma de código, el hash es lo único que permite a alguien
      # desconfiado verificar que el .exe que bajó es el que se publicó aquí.
      - name: Compute installer SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/release/Singevery-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          Write-Host "SHA-256: $hash"
          "### Verificación`n`nSHA-256 de ``$($exe.Name)``:`n`n``````$hash```````n" |
            Out-File -FilePath release-notes.md -Encoding utf8

      # Puerta de smoke test: un instalador que va a manos de terceros no se
      # publica sin que la app empaquetada demuestre que arranca. Lanza el
      # win-unpacked, espera a que el proceso siga vivo (no crasheó al iniciar)
      # y lo cierra. Si el arranque falla, el tag no publica release.
      - name: Smoke test packaged app
        shell: pwsh
        env:
          # Un fallo de inicialización de GPU/compositor en el runner no debe
          # tumbar el release: la app de los usuarios corre con GPU normal.
          ELECTRON_DISABLE_GPU: '1'
        run: |
          $exe = 'apps/desktop/release/win-unpacked/Singevery.exe'
          if (-not (Test-Path $exe)) { throw "Singevery.exe no existe en win-unpacked" }
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            throw "Smoke test falló: Singevery.exe salió con código $($proc.ExitCode) a los 10 s"
          }
          Write-Host "Smoke test OK: proceso vivo tras 10 s (PID $($proc.Id))"
          Stop-Process -Id $proc.Id -Force
          # El sidecar SMTC queda huérfano si el padre muere con -Force.
          Stop-Process -Name espejo-smtc -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          body_path: release-notes.md
          files: |
            apps/desktop/release/Singevery-Setup-*.exe
            docs/demo-readme.mp4
            docs/demo.mp4

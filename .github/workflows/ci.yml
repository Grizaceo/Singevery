name: CI

# Corre en TODA rama, no solo en main: durante julio de 2026 el trabajo vivió en
# una rama paralela y 11 commits llegaron al momento de publicar sin haber
# pasado nunca por CI. La red de seguridad no sirve si solo mira una rama.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Lint
        working-directory: apps/desktop
        run: npm run lint

      - name: Test
        working-directory: apps/desktop
        run: npm test

      - name: Build
        working-directory: apps/desktop
        run: npm run build

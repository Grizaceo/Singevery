# Configuración de empaquetado con electron-builder.
# Foco: Windows NSIS (.exe). macOS/Linux se pueden añadir después.
#
# Flujo completo (en Windows):
#   npm run package:full   → recompila el sidecar SMTC autocontenido (.NET),
#                            build de la app, avisos de terceros e instalador.
#   npm run package        → igual pero sin recompilar el sidecar.
# Salida: release/Singevery-Setup-<version>.exe
appId: com.gris.singevery
productName: Singevery
copyright: Copyright © 2026 Gris

directories:
  output: release
  buildResources: build

# Incluye el sidecar SMTC compilado (native/smtc/dist) en los recursos de la
# app empaquetada; smtcPath.ts lo autodetecta bajo process.resourcesPath.
# IMPORTANTE: publicar el sidecar AUTOCONTENIDO (npm run build:smtc) antes de
# empaquetar para terceros — si no, exige .NET 8 instalado en el equipo destino.
extraResources:
  - from: build/smtc-dist
    to: native/smtc/dist
    filter: ['**/*', '!*.pdb']

# Documentos que el usuario final debe poder leer: quedan junto a Singevery.exe.
extraFiles:
  - from: ../../LICENSE
    to: LICENSE.txt
  - from: ../../AVISO_LEGAL.md
    to: AVISO_LEGAL.md
  - from: ../../GUIA_DE_USO.md
    to: GUIA_DE_USO.md
  - from: PRIVACIDAD_Y_DATOS.md
    to: PRIVACIDAD_Y_DATOS.md
  - from: GUIA_BETA_PROFESORES.md
    to: GUIA_BETA_PROFESORES.md
  - from: build/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - node_modules/kuromoji/dict/**/*
  - '!**/.env*'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,readme}'
  - '!**/node_modules/**/{*.map,*.ts,test.js,test.ts,test.d.ts}'

# Binarios/datos que se leen con fs: mejor fuera del asar.
asarUnpack:
  - node_modules/kuromoji/dict/**/*
  - node_modules/shazamio-core/**/*.wasm

win:
  icon: build/icon.ico
  # Incrusta nombre, versión e icono aunque no haya certificado. La firma sólo
  # se aplica cuando electron-builder recibe credenciales de firma válidas.
  signAndEditExecutable: true
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Singevery
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  # Licencia + avisos que el instalador muestra antes de instalar.
  license: build/license.txt
